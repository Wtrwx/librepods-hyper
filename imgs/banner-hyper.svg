<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="640" viewBox="0 0 1600 640" role="img" aria-labelledby="title desc">
  <title id="title">LibrePods Hyper</title>
  <desc id="desc">One pair. More freedom. Earbuds connect Android and iPhone, with smart routing, HyperOS integration and MIUIx.</desc>
  <defs>
