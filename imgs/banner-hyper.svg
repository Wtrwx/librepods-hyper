    <linearGradient id="accent" x2="1" y2="1"><stop stop-color="#a5f2cf"/><stop offset="1" stop-color="#43d9bc"/></linearGradient>
    <linearGradient id="pod" x2="1" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#b7cad5"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#43d9bc" stop-opacity=".13"/><stop offset="1" stop-color="#43d9bc" stop-opacity="0"/></radialGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#b4cde0" opacity=".09"/></pattern>
  </defs>
  <rect width="1600" height="640" rx="32" fill="url(#bg)"/>
  <rect x="800" width="800" height="640" rx="32" fill="url(#dots)"/>
  <circle cx="1190" cy="330" r="330" fill="url(#glow)"/>
