name: Android CI

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'root-module-manual/**'
      - '.github/workflows/ci-android.yml'
  pull_request:
    paths:
      - 'android/**'
      - 'root-module-manual/**'
      - '.github/workflows/ci-android.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '16111833'
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android build tools
        run: sdkmanager "platforms;android-37.0" "ndk;30.0.14904198" "cmake;3.22.1"
      - name: Configure signing when available
        env:
          KEYSTORE: ${{ secrets.RELEASE_KEYSTORE_FILE }}
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          python3 - <<'PYTHON'
          import base64, os
          from pathlib import Path
          values = {key: os.environ.get(key, '') for key in ('KEYSTORE', 'STORE_PASSWORD', 'KEY_ALIAS', 'KEY_PASSWORD')}
          if all(values.values()):
              Path('android/release.keystore').write_bytes(base64.b64decode(values['KEYSTORE']))
              def escape(value):
                  return value.replace(chr(92), chr(92) * 2).replace(chr(10), chr(92) + 'n').replace(chr(13), chr(92) + 'r').replace(' ', chr(92) + ' ')
              properties = {'RELEASE_STORE_FILE': '../release.keystore', 'RELEASE_STORE_PASSWORD': values['STORE_PASSWORD'], 'RELEASE_KEY_ALIAS': values['KEY_ALIAS'], 'RELEASE_KEY_PASSWORD': values['KEY_PASSWORD']}
              Path('android/local.properties').write_text(''.join(key + '=' + escape(value) + chr(10) for key, value in properties.items()))
              print('Using configured signing key')
          else:
              print('Using the CI debug signing key; no release signing is configured')
          PYTHON
      - name: Run unit tests and build FOSS APK and root module
        working-directory: android
        run: ./gradlew :app:testFossDebugUnitTest :app:assembleFossDebug :app:zipDebugModule --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: LibrePods-Hyper-FOSS-debug
          path: android/app/build/outputs/apk/foss/debug/app-foss-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: LibrePods-Hyper-root-module-debug
          path: android/app/build/outputs/rootModuleZips/*debug.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: LibrePods-Hyper-unit-test-results
          path: android/app/build/reports/tests/testFossDebugUnitTest/
          if-no-files-found: ignore
